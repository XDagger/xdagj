# Admin Config
admin.telnet.ip = 127.0.0.1
admin.telnet.port = 6001
admin.telnet.password = root

# Node Config
node.ip = 127.0.0.1
node.port = 8001
node.maxInboundConnectionsPerIp = 8
node.seeds = ["127.0.0.1:8001","127.0.0.1:8002"]
node.trustedPeers = []
node.allowPrivateAddresses = true

node.transaction.history.pageSizeLimit = 888

# Node RPC Config
rpc.enabled = true
rpc.http.host = 127.0.0.1
rpc.http.port = 10001
rpc.ws.port = 10002
# Consensus: the unit tests written for 0.8.x check the legacy rules; tests of the
# open-network hardening fork switch it on explicitly (negative = not scheduled).
consensus.opennet.forkEpoch = -1
