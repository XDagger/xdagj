# Admin Config
admin.telnet.ip = 127.0.0.1
admin.telnet.port = 6001
admin.telnet.password = 123

# Pool websocket Config (Node <--> Pools)
pool.whiteIPs = ["0.0.0.0"]
pool.ws.port = 7001

# Node config (Node <--> Node)
node.ip = 127.0.0.1
node.port = 8001
node.tag = XdagJ
# Peers (see docs/OPEN_NETWORK.md). There is no whitelist: once the open-network fork is in force on the
# chain, anybody may connect and peers are found by discovery. Until then the node is closed and only talks
# to the seeds and trusted peers below.
#   node.seeds        - entry points into the network, no other privilege
#   node.trustedPeers - always kept connected, never banned
node.seeds = ["127.0.0.1:8002"]
node.trustedPeers = []
node.discovery.enabled = true
node.minConnections = 8
node.maxConnections = 50
node.maxInboundConnections = 40
node.maxInboundConnectionsPerIp = 8
# node.bindIp = 0.0.0.0        # local address to listen on (default: all interfaces)
# node.keyFile = <root>/node.key  # the node's network identity, created on first start
node.generate.block.enable = true
node.reject.transaction.address = 111111111111111111117K4nzc
node.ration = 5

# Fund config
fund.address = "PKcBtHWDSnAWfZntqWPBLedqBShuKSTzS"
fund.ration = 5

# Node transaction history config
node.transaction.history.enable = true
node.transaction.history.pageSizeLimit = 500

# Node RPC Config
rpc.http.enabled = true
rpc.http.host = 127.0.0.1
rpc.http.port = 10001
rpc.ws.port = 10002


# Randomx Config
randomx.flags.fullmem = false